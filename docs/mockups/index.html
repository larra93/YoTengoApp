<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YoTengoApp — Pantallas del MVP</title>
  <link rel="stylesheet" href="mockups.css">
</head>
<body class="gallery">
  <div class="gallery-wrap">
    <header class="gallery-header">
      <div>
        <p class="eyebrow">YoTengoApp · MVP</p>
        <h1>Pantallas del producto</h1>
        <p>Mockups estáticos del flujo principal: explorar pedidos cercanos, publicar una necesidad, recibir ofertas, negociar, chatear y construir reputación.</p>
      </div>
      <div class="stamp">7 pantallas</div>
    </header>

    <div class="gallery-grid">
      
        <figure class="screen-card">
          <div class="caption">
            <strong>Explorar pedidos</strong>
            <span>Feed cercano y filtros</span>
          </div>
          <div class="device">
            <iframe src="01-explorar.html" title="Explorar pedidos" scrolling="no" loading="eager"></iframe>
          </div>
        </figure>
        <figure class="screen-card">
          <div class="caption">
            <strong>Publicar necesidad</strong>
            <span>Formulario rápido</span>
          </div>
          <div class="device">
            <iframe src="02-publicar.html" title="Publicar necesidad" scrolling="no" loading="eager"></iframe>
          </div>
        </figure>
        <figure class="screen-card">
          <div class="caption">
            <strong>Negociaciones</strong>
            <span>Ofertas recibidas</span>
          </div>
          <div class="device">
            <iframe src="03-negociaciones.html" title="Negociaciones" scrolling="no" loading="eager"></iframe>
          </div>
        </figure>
        <figure class="screen-card">
          <div class="caption">
            <strong>Mi perfil</strong>
            <span>Reputación y actividad</span>
          </div>
          <div class="device">
            <iframe src="04-perfil.html" title="Mi perfil" scrolling="no" loading="eager"></iframe>
          </div>
        </figure>
        <figure class="screen-card">
          <div class="caption">
            <strong>Detalle del pedido</strong>
            <span>Vista del proveedor</span>
          </div>
          <div class="device">
            <iframe src="05-detalle.html" title="Detalle del pedido" scrolling="no" loading="eager"></iframe>
          </div>
        </figure>
        <figure class="screen-card">
          <div class="caption">
            <strong>Enviar oferta</strong>
            <span>Flujo "Tengo esto"</span>
          </div>
          <div class="device">
            <iframe src="06-oferta.html" title="Enviar oferta" scrolling="no" loading="eager"></iframe>
          </div>
        </figure>
        <figure class="screen-card">
          <div class="caption">
            <strong>Chat</strong>
            <span>Coordinación post-aceptación</span>
          </div>
          <div class="device">
            <iframe src="07-chat.html" title="Chat" scrolling="no" loading="eager"></iframe>
          </div>
        </figure>
    </div>
  </div>
</body>
</html>
