  <div class="phone">
    
  <div class="statusbar">
    <span>9:41</span>
    <div class="status-icons">
      <svg class="icon fill"><use href="#i-signal"></use></svg>
      <svg class="icon "><use href="#i-wifi"></use></svg>
      <svg class="icon fill"><use href="#i-battery"></use></svg>
    </div>
  </div>
    
  <div class="apphead">
    <h1 class="title">Publicar necesidad</h1>
    <p class="subtitle">Cuéntale a tus vecinos qué buscas.</p>
  </div>

  <div class="form">
    <div class="field">
      <label>¿Qué necesitas?</label>
      <div class="input"><span class="placeholder">Ej: Disfraz de astronauta talla 6</span></div>
    </div>

    <div class="field">
      <label>Tipo de trato</label>
      <div class="segment">
        <button class="active"><svg class="icon "><use href="#i-key"></use></svg> Arrendar</button>
        <button><svg class="icon "><use href="#i-repeat"></use></svg> Préstamo</button>
        <button><svg class="icon "><use href="#i-swap"></use></svg> Trueque</button>
      </div>
    </div>

    <div class="two-col">
      <div class="field">
        <label>Categoría</label>
        <div class="input">Disfraces <svg class="icon chev"><use href="#i-chev-right"></use></svg></div>
      </div>
      <div class="field">
        <label>Fechas</label>
        <div class="input"><svg class="icon "><use href="#i-calendar"></use></svg> 12 – 15 nov</div>
      </div>
    </div>

    <div class="field">
      <label>Descripción</label>
      <div class="input placeholder">Cuéntanos para qué lo necesitas...</div>
    </div>

    <div class="field">
      <label>Presupuesto o qué ofreces</label>
      <div class="input"><span class="placeholder">Ej: $8.000 por día o trueque por juego</span></div>
    </div>

    <div class="field">
      <label>Foto de referencia (opcional)</label>
      <div class="upload">
        <svg class="icon "><use href="#i-camera"></use></svg>
        <span>Agregar foto</span>
        <span class="tiny muted">JPG o PNG · máx. 5 MB</span>
      </div>
    </div>

    <button class="btn primary block">Publicar necesidad</button>
  </div>
    
    <nav class="tabbar">
      
    <div class="tab  ">
      <svg class="icon "><use href="#i-search"></use></svg><span>Explorar</span>
    </div>
      
    <div class="tab active ">
      <div class="plus"><svg class="icon "><use href="#i-plus"></use></svg></div><span>Publicar</span>
    </div>
      
    <div class="tab  badge-dot">
      <svg class="icon "><use href="#i-chat"></use></svg><span>Negociaciones</span>
    </div>
      
    <div class="tab  ">
      <svg class="icon "><use href="#i-user"></use></svg><span>Perfil</span>
    </div>
    </nav>
  </div>
</body>
</html>
